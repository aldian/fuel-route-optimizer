name: CI Quality Gate & Automated Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test (>= 95% Coverage Gate) & OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Check
        run: |
          python -m py_compile manage.py config/urls.py config/settings/*.py apps/*/*.py

      - name: Django System & Production Deployment Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DJANGO_SECRET_KEY: test-secret-key-37cec3b1487d
        run: |
          python manage.py check

      - name: OpenAPI 3.1 Schema Validation
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DJANGO_SECRET_KEY: test-secret-key-37cec3b1487d
        run: |
          python manage.py spectacular --validate

      - name: Validate Local Database Migrations & Seeding Commands
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DJANGO_SECRET_KEY: test-secret-key-37cec3b1487d
        run: |
          python manage.py migrate --noinput
          python manage.py load_fuel_stations
          python manage.py load_us_gazetteer

      - name: Run Complete Test Suite (>= 95% Coverage Gate)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          pytest tests/ --cov=apps --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Test Zero-to-Production Deploy Wizard (--dry-run)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          python manage.py deploy_wizard --target docker-vps --domain api.example.com --non-interactive --dry-run
