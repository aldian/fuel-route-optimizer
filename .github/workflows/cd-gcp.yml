name: CD Google Cloud Run (Terraform)

on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: "GCP Project ID"
        required: false
        default: ""
      gcp_region:
        description: "GCP Region"
        required: false
        default: "us-central1"
      provision_postgres:
        description: "Provision Cloud SQL PostgreSQL 16 from scratch"
        required: false
        default: "true"
      provision_redis:
        description: "Provision Cloud Memorystore Redis 7 from scratch"
        required: false
        default: "true"

jobs:
  deploy-gcp:
    name: Deploy to GCP Cloud Run via Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init & Validate
        working-directory: deploy/terraform/gcp
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Apply (Cloud Run + Optional Cloud SQL & Memorystore)
        if: env.GCP_SA_KEY != ''
        working-directory: deploy/terraform/gcp
        env:
          TF_VAR_project_id: ${{ github.event.inputs.gcp_project_id || secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ github.event.inputs.gcp_region || 'us-central1' }}
          TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
          TF_VAR_allowed_hosts: ${{ secrets.ALLOWED_HOSTS || '.run.app,.a.run.app,localhost,127.0.0.1' }}
          TF_VAR_provision_postgres: ${{ github.event.inputs.provision_postgres || secrets.PROVISION_POSTGRES || 'false' }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_provision_redis: ${{ github.event.inputs.provision_redis || secrets.PROVISION_REDIS || 'false' }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
        run: |
          terraform apply -auto-approve
