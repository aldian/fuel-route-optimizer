apiVersion: v1
kind: Secret
metadata:
  name: fuel-optimizer-secrets
  labels:
    app.kubernetes.io/name: fuel-route-optimizer
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "k8s-default-secret-key-replace-via-spotter-deploy-wizard-0000"
  POSTGRES_DB: "spotter_fuel"
  POSTGRES_USER: "spotter"
  POSTGRES_PASSWORD: "spotter-k8s-db-password"
  DATABASE_URL: "postgres://spotter:spotter-k8s-db-password@db:5432/spotter_fuel"
  REDIS_URL: "redis://redis:6379/0"
