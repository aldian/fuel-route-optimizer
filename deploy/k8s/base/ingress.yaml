apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuel-route-optimizer-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fuel-route-optimizer
                port:
                  number: 80
