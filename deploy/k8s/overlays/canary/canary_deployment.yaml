apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuel-route-optimizer-canary
  labels:
    app.kubernetes.io/name: fuel-route-optimizer
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fuel-route-optimizer
      track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuel-route-optimizer
        track: canary
    spec:
      containers:
        - name: api
          image: ghcr.io/aldian/fuel-route-optimizer:canary
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: fuel-optimizer-secrets
            - configMapRef:
                name: fuel-optimizer-config
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
