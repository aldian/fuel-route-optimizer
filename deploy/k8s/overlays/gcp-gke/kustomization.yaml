apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - backendconfig.yaml
  - certificate.yaml

patches:
  - path: ingress_patch.yaml

images:
  - name: ghcr.io/aldian/fuel-route-optimizer
    newName: us-central1-docker.pkg.dev/aldianfazrihady/fuel-route-optimizer/app
    newTag: latest
