apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuel-route-optimizer-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: api.fuel-optimizer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fuel-route-optimizer
                port:
                  number: 80
