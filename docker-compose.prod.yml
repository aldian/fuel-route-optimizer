services:
  web:
    build:
      context: .
      target: runtime
    restart: always
    env_file:
      - .env.production
    environment:
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - app-net

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-spotter} -d $${POSTGRES_DB:-spotter_fuel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  caddy:
    image: caddy:2-alpine
    restart: always
    env_file:
      - .env.production
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-net

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  app-net:
    driver: bridge
