app = "fuel-route-optimizer"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  ALLOWED_HOSTS = ".fly.dev,.internal,localhost,127.0.0.1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/v1/health/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

